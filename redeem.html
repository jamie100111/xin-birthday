<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xin 特權兌換成功</title>
<meta name="description" content="叮咚！專屬生日特權已成功兌換！">
<meta property="og:title" content="🎉 叮咚！專屬生日特權已成功兌換！">
<meta property="og:description" content="棉花糖烤好了，大獎也蓋章生效囉">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf1dc; --sand:#f1ddb3; --paper:#fffaf0;
  --quokka:#c98d5f; --quokka-d:#8a5533; --cocoa:#4a2a17;
  --night:#1f4f9a; --red:#c8312f; --green:#3f7a4a; --teal:#2f8f9d;
  --gold:#e9b84a; --gold-d:#b9862a; --gold-l:#fbe39a;
  --ink:#3d2414; --muted:#7a5a43;
  --shadow:0 10px 0 rgba(74,42,23,.12), 0 18px 40px rgba(74,42,23,.18);
  --font:"Huninn","Fredoka","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-en:"Fredoka","Huninn",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:#c98d5f;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(rgba(255,255,255,.35) 1.5px, transparent 2px);background-size:26px 26px}
.bunting{position:absolute;inset:0 0 auto 0;height:54px;z-index:3;pointer-events:none}
.bunting svg{width:100%;height:100%}
main{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:72px 16px 44px}

.head{text-align:center;color:#fff;margin-bottom:18px}
.bell{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--paper);border:3px solid var(--cocoa);box-shadow:0 5px 0 var(--cocoa);font-size:32px;animation:ding 1.6s ease-in-out .3s 3;transform-origin:50% 10%}
@keyframes ding{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(2deg)}}
.head h1{font-size:clamp(20px,6vw,25px);line-height:1.4;margin:14px 0 6px;text-shadow:0 3px 0 var(--cocoa)}
.head p{font-size:15.5px;opacity:.95;text-shadow:0 2px 0 rgba(74,42,23,.5)}

.film{border-radius:50% 50% 28px 28px/38% 38% 28px 28px;overflow:hidden;background:#fbf1dc;aspect-ratio:16/9;margin-bottom:22px;box-shadow:0 0 0 6px rgba(255,250,240,.35),0 0 0 12px rgba(255,250,240,.15)}
.film video{width:100%;height:100%;object-fit:cover;display:block}

.cert{position:relative;background:var(--paper);border-radius:20px;border:3px solid var(--cocoa);box-shadow:var(--shadow);padding:12px;animation:enter .8s cubic-bezier(.2,1.3,.4,1) both .2s}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.frame{position:relative;border:3px double var(--gold-d);border-radius:12px;padding:22px 16px 18px;
  background:
    radial-gradient(circle at 50% 120%, rgba(233,184,74,.18), transparent 60%),
    repeating-linear-gradient(45deg, rgba(201,141,95,.06) 0 2px, transparent 2px 9px),
    var(--paper)}
.corner{position:absolute;width:22px;height:22px;border:3px solid var(--gold);}
.corner.tl{top:6px;left:6px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.corner.tr{top:6px;right:6px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.corner.bl{bottom:6px;left:6px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.corner.br{bottom:6px;right:6px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.c-star{position:absolute;top:-26px;left:50%;width:52px;transform:translateX(-50%)}
.c-title{text-align:center;font-family:var(--font-en);font-weight:700;color:var(--quokka-d);font-size:18px;letter-spacing:1px;line-height:1.35}
.c-sub{text-align:center;font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:2px}
.rule{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--gold-d)}
.rule::before,.rule::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr;gap:6px;padding:10px 2px;border-bottom:2px dashed var(--sand);font-size:15px;line-height:1.55}
.row:last-child{border-bottom:0}
.row dt{color:var(--quokka-d);white-space:nowrap}
.row dd{font-weight:600}
.ok{color:var(--green)}
.code{font-family:var(--font-en);letter-spacing:.5px;word-break:break-all}

.sign{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sig{display:flex;align-items:center;gap:8px;border-top:2px solid var(--cocoa);padding-top:8px;font-size:12.5px;color:var(--muted)}
.sig img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--cocoa);background:#fff;flex:none}
.sig b{display:block;font-family:var(--font-en);color:var(--ink);font-size:14px}

.stamp{position:absolute;right:8px;top:150px;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--red);
  border:4px solid var(--red);box-shadow:inset 0 0 0 4px var(--paper), inset 0 0 0 7px var(--red);background:rgba(255,250,240,.6);
  font-family:var(--font-en);font-weight:700;line-height:1.1;transform:rotate(-16deg) scale(3);opacity:0;pointer-events:none}
.stamp .big{font-size:17px;letter-spacing:1px}
.stamp .small{font-size:10.5px;letter-spacing:1px}
.stamp.slam{animation:slam .45s cubic-bezier(.5,0,.75,0) forwards}
@keyframes slam{0%{opacity:0;transform:rotate(-16deg) scale(3)}80%{opacity:.9;transform:rotate(-16deg) scale(.92)}100%{opacity:.85;transform:rotate(-16deg) scale(1)}}
.cert.thud{animation:thud .35s}
@keyframes thud{0%,100%{transform:none}40%{transform:translateY(4px) scale(.99)}}

.note{margin:22px 4px 0;text-align:center;color:#fff;font-size:15px;line-height:1.8;text-shadow:0 2px 0 rgba(74,42,23,.5)}
.strip{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:14px}
.strip img{height:150px;width:auto;filter:drop-shadow(0 6px 0 rgba(74,42,23,.25))}
.strip img:first-child{animation:bob 2.8s ease-in-out infinite}
.strip img:last-child{animation:bob 2.8s ease-in-out -1.4s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.snow{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.flake{position:absolute;top:-80px;background:url(aa.png) center/contain no-repeat;animation:fall linear forwards;filter:drop-shadow(0 3px 4px rgba(74,42,23,.25))}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.stamp{opacity:.85;transform:rotate(-16deg)}}
</style>
</head>
<body>
<div class="bunting" aria-hidden="true"><svg id="bunting" preserveAspectRatio="none"></svg></div>
<main>
  <header class="head">
    <div class="bell" aria-hidden="true">🔔</div>
    <h1>🎉 叮咚！<br>專屬生日特權已成功兌換！</h1>
    <p>(棉花糖烤好了，大獎也蓋章生效囉)</p>
  </header>

  <div class="film"><video src="8.mp4" autoplay muted loop playsinline aria-label="Quokka 和 Bobo 們圍著營火烤棉花糖"></video></div>

  <section class="cert" id="cert">
    <div class="frame">
      <img class="c-star" src="star.png" alt=""><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="c-title">🐻 QUOKKA &amp; BOBO<br>SPECIAL CERTIFICATE</div>
      <div class="c-sub">專屬特權兌換證書</div>
      <div class="rule">✦</div>
      <dl class="rows">
        <div class="row"><dt>【尊貴持有人】：</dt><dd>Xin 👑</dd></div>
        <div class="row"><dt>【兌換項目】：</dt><dd>專屬神秘禮物</dd></div>
        <div class="row"><dt>【審核狀態】：</dt><dd class="ok">✅ 審核通過（APPROVED!）</dd></div>
        <div class="row"><dt>【有效期限】：</dt><dd>永久有效・隨時生效・不可撤銷</dd></div>
        <div class="row"><dt>【專屬認證號】：</dt><dd class="code">XIN-BDAY-FOREVER-HAPPY</dd></div>
      </dl>
      <div class="sign">
        <div class="sig"><img src="c4.png" alt="" style="object-fit:cover;object-position:62% 8%"><div><b>Quokka</b>簽發</div></div>
        <div class="sig"><img src="aa.png" alt="" style="object-fit:contain;padding:3px"><div><b>Bobo</b>見證</div></div>
      </div>
    </div>
    <div class="stamp" id="stamp"><div><div class="small">★ XIN ★</div><div class="big">APPROVED</div><div class="small">2026 · 生效</div></div></div>
  </section>

  <p class="note">憑此證書向發行人領取專屬神秘禮物 🎁<br>生日快樂，Xin！</p>
  <div class="strip">
    <img src="c1.png" alt="Quokka 烤棉花糖給 Bobo">
    <img src="c2.png" alt="Quokka 和 Bobo">
  </div>
</main>
<div class="snow" id="snow" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
(() => {
const COLORS=['#c98d5f','#c8312f','#3f7a4a','#2f8f9d','#e9b84a','#1f4f9a','#ffffff'];
function drawBunting(){
  const svg=document.getElementById('bunting'),w=innerWidth,n=Math.max(8,Math.round(w/44)),step=w/n;
  let s=`<path d="M0 6 Q ${w/2} 22 ${w} 6" fill="none" stroke="#4a2a17" stroke-width="2"/>`;
  for(let i=0;i<n;i++){const x=i*step,t1=x/w,t2=(x+step)/w,y1=6+64*t1*(1-t1),y2=6+64*t2*(1-t2);
    s+=`<path d="M${x+3} ${y1} L${x+step-3} ${y2} L${x+step/2} ${Math.max(y1,y2)+30} Z" fill="${COLORS[i%6]}" stroke="#4a2a17" stroke-width="2" stroke-linejoin="round"/>`;}
  svg.setAttribute('viewBox',`0 0 ${w} 54`);svg.innerHTML=s;
}
drawBunting();addEventListener('resize',drawBunting);

const stamp=document.getElementById('stamp'),cert=document.getElementById('cert');
setTimeout(()=>{
  stamp.classList.add('slam');
  setTimeout(()=>{
    cert.classList.add('thud');
    if(window.confetti){
      const r=stamp.getBoundingClientRect();
      confetti({particleCount:150,spread:100,origin:{x:(r.left+r.width/2)/innerWidth,y:(r.top+r.height/2)/innerHeight},colors:COLORS});
    }
  },380);
},1300);

const box=document.getElementById('snow');
function spawn(){
  const f=document.createElement('div');f.className='flake';
  const size=20+Math.random()*30,dur=6+Math.random()*5;
  f.style.cssText=`left:${Math.random()*100}vw;width:${size}px;height:${size*1.08}px;animation-duration:${dur}s;--dx:${(Math.random()*100-50)|0}px;--rot:${(Math.random()*300-150)|0}deg;opacity:${.7+Math.random()*.3}`;
  box.appendChild(f);setTimeout(()=>f.remove(),dur*1000+200);
}
let n=0;const t=setInterval(()=>{spawn();if(++n>45)clearInterval(t);},260);
})();
</script>
</body>
</html>
